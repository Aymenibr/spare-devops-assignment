name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build image
        run: docker compose build

      - name: Compose up
        run: docker compose up -d

      # checks the published port from outside, not just the container's own
      # HEALTHCHECK - this also catches port-mapping/networking mistakes
      - name: Poll /health until healthy
        run: |
          set -euo pipefail
          port="$(grep -E '^PORT=' .env | tail -1 | cut -d= -f2 || true)"
          port="${port:-8080}"
          timeout=60
          elapsed=0
          until curl -sf "http://localhost:${port}/health" >/dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "::error::API did not become healthy within ${timeout}s"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "API healthy after ${elapsed}s"

      - name: Run smoke test
        run: |
          # written on Windows - executable bit isn't always reliable after checkout
          chmod +x scripts/ops.sh
          ./scripts/ops.sh smoke

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

  # only on push to main (build-test runs for PRs too, this job doesn't), and only
  # after build-test passes, so we never publish a broken image
  push:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires a lowercase image path, github.repository isn't guaranteed to be
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # latest = newest main build, sha tag pins an exact build for rollback
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
